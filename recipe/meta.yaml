{% set name = "TexSoup" %}
{% set version = "0.3.1" %}
{% set sha256 = "3f6b2ad0abe3688a6656f544c1ba04d0eb25f423f8c377b7369f9ce061ddb70b" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 1
  script: python setup.py install --single-version-externally-managed --record record.txt

requirements:
  host:
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - TexSoup
    - TexSoup.tex


about:
  home: https://github.com/alvinwan/TexSoup
  license: BSD-2-Clause
  license_family: BSD
  license_file: {{ environ["RECIPE_DIR"] }}/LICENSE
  summary: |
    Parses valid LaTeX and provides a variety of BeautifulSoup-esque methods and
    Pythonic idioms for iterating and searching the parse tree.

extra:
  recipe-maintainers:
    - scopatz
